apiVersion: v1
kind: Service
metadata:
  name: prysm-beacon
  namespace: node-operator
spec:
  selector:
    app.kubernetes.io/name: prysm-beacon
  ports:
    - name: beacon-api
      port: 3500
      targetPort: 3500
apiVersion: v1
kind: Service
metadata:
  name: nethermind-execution
  namespace: node-operator
spec:
  selector:
    app.kubernetes.io/name: nethermind
  ports:
    - name: p2p-tcp
      port: 30303
      targetPort: p2p-tcp
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata: {name: nethermind-upcheck-proxy, namespace: node-operator}
spec:
  selector: {app.kubernetes.io/component: nethermind-upcheck-proxy}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nethermind-upcheck-proxy, namespace: node-operator}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/component: nethermind-upcheck-proxy}}
  template:
    metadata: {labels: {app.kubernetes.io/component: nethermind-upcheck-proxy}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: proxy
          image: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/node-operator-baseline-node-runtime-upcheck-python@sha256:fb305627ba331d70f8cc82509a4fae4be858422fd257e170543fbbefcefb9588
          command: [python3, -c]
          args:
            - |
              import socket
              from http.server import BaseHTTPRequestHandler, HTTPServer
              upstream = 'nethermind-execution'
              class Handler(BaseHTTPRequestHandler):
                  def send_response(self, code, message=None):
                      self.send_response_only(code, message)
                      self.send_header('Date', self.date_time_string())
                  def do_GET(self):
                      if self.path != '/upcheck': self.send_error(404); return
                      conn = None
                      try:
                          # Reachability only: connect to the P2P listener and
                          # close without sending application bytes.
                          conn = socket.create_connection((upstream, 30303), timeout=5)
                          self.send_response(200); self.end_headers()
                      except Exception: self.send_error(503)
                      finally:
                          if conn is not None: conn.close()
                  def do_POST(self): self.send_error(405)
                  def do_PUT(self): self.send_error(405)
                  def do_DELETE(self): self.send_error(405)
                  def do_PATCH(self): self.send_error(405)
                  def log_message(self, *_): pass
              HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
          ports: [{name: http, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, privileged: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 100m, memory: 128Mi}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: nethermind-upcheck-proxy-to-p2p, namespace: node-operator}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: nethermind}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/component: nethermind-upcheck-proxy}}
      ports: [{protocol: TCP, port: 30303}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: nethermind-upcheck-proxy-egress, namespace: node-operator}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: nethermind-upcheck-proxy}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: nethermind}}
      ports: [{protocol: TCP, port: 30303}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
