apiVersion: v1
kind: Pod
metadata: {name: project-coverage-collector-root-spoof, namespace: validator-observability}
spec:
  serviceAccountName: validator-log-collector
  securityContext: {seccompProfile: {type: RuntimeDefault}}
  volumes:
    - {name: varlog, hostPath: {path: /var/log, type: Directory}}
  containers:
    - name: fluent-bit
      image: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/node-operator-baseline-validator-fluent-bit@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      volumeMounts: [{name: varlog, mountPath: /var/log, readOnly: true}]
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, privileged: false, readOnlyRootFilesystem: true}
      resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
