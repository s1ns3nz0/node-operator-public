# This is intentionally a template, excluded from kustomization. The release
# renderer accepts only a reviewed same-account ECR digest and emits the live
# DaemonSet. A tag, public registry, or unreviewed image is rejected.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: validator-log-collector
  namespace: validator-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: validator-log-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/component: validator-log-collector
    spec:
      serviceAccountName: validator-log-collector
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      # The collector reads the read-only /var/log hostPath and therefore must
      # retain its image's root user; RuntimeDefault still constrains syscalls.
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fluent-bit
          image: REPLACE_WITH_APPROVED_PRIVATE_ECR_DIGEST
          args: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: varlog, mountPath: /var/log, readOnly: true}
            - {name: config, mountPath: /fluent-bit/etc, readOnly: true}
            - {name: buffers, mountPath: /buffers}
      volumes:
        - {name: varlog, hostPath: {path: /var/log, type: Directory}}
        - {name: config, configMap: {name: validator-log-collector-config}}
        - {name: buffers, emptyDir: {}}
