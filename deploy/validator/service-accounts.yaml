# These identities are deliberately separate. None is a Vault admin, CI, or
# release-signing identity, and no service-account token is mounted implicitly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: validator-onboarding
  namespace: validator-operations
  labels:
    node-operator.io/use-case: validator-onboarding
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: validator-remote-signer
  namespace: validator-operations
  labels:
    node-operator.io/use-case: remote-signing
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: validator-slashing-db
  namespace: validator-operations
  labels:
    node-operator.io/use-case: slashing-database
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: validator-client
  namespace: validator-operations
  labels:
    node-operator.io/use-case: validator-client
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: validator-fence-controller
  namespace: validator-operations
  labels:
    node-operator.io/use-case: signer-fencing
automountServiceAccountToken: false
