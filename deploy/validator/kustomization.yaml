apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# This base deliberately contains only non-secret, non-signing boundary
# objects. A rendered runtime release is required to create signer Pods.
resources:
  - namespace.yaml
  - storage-class.yaml
  - service-accounts.yaml
  - network-policies.yaml
  - runtime-contract.yaml
  - onboarding-contract.yaml
  - evidence-contract.yaml
