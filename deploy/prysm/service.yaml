apiVersion: v1
kind: Service
metadata:
  name: prysm-beacon
  namespace: node-operator
  labels:
    app.kubernetes.io/name: prysm-beacon
    app.kubernetes.io/part-of: hoodi-node
spec:
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: prysm-beacon
    app.kubernetes.io/part-of: hoodi-node
  ports:
    - name: p2p-tcp
      port: 13000
      protocol: TCP
      targetPort: p2p-tcp
    - name: p2p-udp
      port: 13000
      protocol: UDP
      targetPort: p2p-udp
    - name: beacon-api
      port: 3500
      protocol: TCP
      targetPort: 3500
    - name: metrics
      port: 8080
      protocol: TCP
      targetPort: metrics
