# These policies narrow the only allowed paths for the Hoodi consensus client.
# Dynamic Hoodi peers use the private NAT route, with an exact port allow-list
# duplicated in the dedicated Hoodi node security group and VPC Flow Logs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prysm-dns
  namespace: node-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prysm-beacon
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prysm-nat-port-egress
  namespace: node-operator
  labels:
    node-operator.io/egress-class: hoodi-nat-port-restricted
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prysm-beacon
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 13000
        - protocol: TCP
          port: 9000
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 13000
        - protocol: UDP
          port: 13001
        - protocol: UDP
          port: 12000
        - protocol: UDP
          port: 9000
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prysm-engine-api-egress
  namespace: node-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prysm-beacon
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nethermind
              app.kubernetes.io/component: execution-client
      ports:
        - protocol: TCP
          port: 8551
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prysm-vault-egress
  namespace: node-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prysm-beacon
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8200
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prysm-metrics-ingress
  namespace: node-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prysm-beacon
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: validator-observability
          podSelector:
            matchLabels:
              app.kubernetes.io/component: validator-metrics-collector
      ports:
        - protocol: TCP
          port: 8080
