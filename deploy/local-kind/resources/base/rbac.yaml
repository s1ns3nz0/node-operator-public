apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: node-workload-read-config
  namespace: node-operator
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-workload-read-config
  namespace: node-operator
subjects:
  - kind: ServiceAccount
    name: node-workload
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: node-workload-read-config
