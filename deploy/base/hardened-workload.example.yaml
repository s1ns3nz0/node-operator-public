apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardened-workload-example
  namespace: node-operator
spec:
  replicas: 1
  selector:
    matchLabels: {app: hardened-example}
  template:
    metadata:
      labels: {app: hardened-example}
    spec:
      serviceAccountName: node-workload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: example
          image: registry.example/node@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 1, memory: 1Gi}
