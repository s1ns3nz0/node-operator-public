# Apply this file only after the private cert-manager Helm installation is
# Ready. It intentionally contains no Secret resource or certificate bytes.
# cert-manager creates vault-internal-ca and vault-tls during reconciliation;
# operators must never create, inspect, export, or commit either Secret.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-selfsigned-bootstrap
  namespace: vault
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-internal-ca
  namespace: vault
spec:
  isCA: true
  commonName: node-operator-vault-internal-ca
  secretName: vault-internal-ca
  duration: 8760h
  renewBefore: 720h
  revisionHistoryLimit: 1
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: vault-selfsigned-bootstrap
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-internal-ca
  namespace: vault
spec:
  ca:
    secretName: vault-internal-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-server-tls
  namespace: vault
spec:
  secretName: vault-tls
  commonName: vault.vault.svc
  dnsNames:
    # The only release-facing Vault identity. It resolves solely through the
    # private hosted zone created for the VPC-internal signer path.
    - vault.node-operator.internal
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault-active
    - vault-active.vault
    - vault-active.vault.svc
    - vault-active.vault.svc.cluster.local
    - vault-internal
    - vault-internal.vault
    - vault-internal.vault.svc
    - vault-internal.vault.svc.cluster.local
    - vault-0.vault-internal
    - vault-0.vault-internal.vault
    - vault-0.vault-internal.vault.svc
    - vault-0.vault-internal.vault.svc.cluster.local
    - vault-1.vault-internal
    - vault-1.vault-internal.vault
    - vault-1.vault-internal.vault.svc
    - vault-1.vault-internal.vault.svc.cluster.local
    - vault-2.vault-internal
    - vault-2.vault-internal.vault
    - vault-2.vault-internal.vault.svc
    - vault-2.vault-internal.vault.svc.cluster.local
  usages:
    - server auth
    - client auth
  duration: 2160h
  renewBefore: 360h
  revisionHistoryLimit: 1
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: vault-internal-ca
