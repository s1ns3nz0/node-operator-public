# The cert-manager v1.21.1 chart itself is mirrored to the private ECR OCI
# repository before this file is used. Every scheduled image is an immutable
# ECR tag plus the source/ECR manifest digest; the digest is authoritative.
crds:
  enabled: true
  keep: true

global:
  leaderElection:
    namespace: cert-manager
  revisionHistoryLimit: 1

# This portfolio cluster only uses the namespaced Vault internal CA. It has no
# ACME issuer or Prometheus dependency.
prometheus:
  enabled: false

image:
  repository: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/node-operator-baseline-gitops-cert-manager
  tag: 416a2d76870d996460e62bd7f521bf14fa017be9e3e904aab92163a331fcb61a
  digest: sha256:416a2d76870d996460e62bd7f521bf14fa017be9e3e904aab92163a331fcb61a
  pullPolicy: IfNotPresent
resources:
  requests: {cpu: "100m", memory: "128Mi"}
  limits: {cpu: "500m", memory: "512Mi"}
securityContext:
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: ["ALL"]}

