# Purpose: Provide reusable Fence-only static checks and isolated real-process DAST; do not target live EKS.
name: CI Fence Security

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Role: Install pinned analysis tools, test Fence and collect local DAST reports, including failures.
  fence-security:
    name: Fence Security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      # Role: Prepare the Go version selected by the repository for Fence tests.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache: false
      # Role: Install the approved analysis tool only after verifying its checksum.
      - name: Checksum-pinned fence SAST tool
        run: scripts/ci/install-fence-security-tools.sh "$RUNNER_TEMP/fence-security-tools"
      # Role: Run Fence unit tests, static analysis and scanner/report contract tests.
      - name: Fence unit tests and static analysis
        env:
          GOSEC_BIN: ${{ runner.temp }}/fence-security-tools/gosec
        run: |
          go test ./cmd/validator-signing-fence
          bash scripts/ci/test-fence-security-sast.sh
          bash scripts/ci/test-fence-security-dast-report.sh
          scripts/ci/run-fence-security-sast.sh "$RUNNER_TEMP/fence-security/sast"
      # Role: Exercise a local Fence process in an isolated test environment, not a live validator.
      - name: Isolated real-process fence DAST
        run: scripts/ci/run-fence-security-dast.sh "$RUNNER_TEMP/fence-security/dast"
      # Role: Retain Fence security reports even when the test job fails.
      - name: Fence-only security reports including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fence-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fence-security/
          if-no-files-found: error
          retention-days: 30
