# Purpose: Measure repository security posture with the official OpenSSF Scorecard action.
# The workflow never executes pull-request code with write privileges.
name: CI Repository Posture

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 4'
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        with:
          sarif_file: ${{ github.workspace }}/scorecard.sarif
      - name: Normalize Scorecard evidence
        env:
          SCORECARD_SARIF: ${{ github.workspace }}/scorecard.sarif
          OUTPUT: ${{ runner.temp }}/scorecard-evidence.json
        run: bash scripts/ci/normalize-scorecard-evidence.sh
      - name: Upload posture evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: repository-posture-${{ github.sha }}
          path: |
            ${{ github.workspace }}/scorecard.sarif
            ${{ runner.temp }}/scorecard-evidence.json
          if-no-files-found: error
          retention-days: 90
