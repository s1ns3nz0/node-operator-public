# Purpose: Validate PRs and main commits with independent read-only jobs; do not deploy or publish.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Role: Reuse the Fence security suite; its result is required by the quality check.
  fence-security:
    name: Fence Security
    uses: ./.github/workflows/fence-security.yml
    permissions:
      contents: read
  # Role: Run local contract, regression and tooling checks; live-operation names describe scripts under test, not production ceremonies.
  quality-tests:
    name: Code Quality
    runs-on: ubuntu-24.04
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Role: Install repository-pinned policy tools for the subsequent local checks.
      - name: Policy Tools
        run: scripts/ci/install-policy-tools.sh "$RUNNER_TEMP/node-operator-policy-tools"
      # Role: Validate repository harness configuration without deploying infrastructure.
      - name: Harness structure
        run: npm run harness:check
      # Role: Contract test: Enforce ShellCheck static analysis of CI and release shell scripts.
      - name: Shell Quality
        run: scripts/ci/test-script-quality.sh
      # Role: Enforce the pinned-action, least-privilege and fail-closed red-team baseline.
      - name: DevSecOps Red-Team Contract
        run: scripts/ci/test-devsecops-redteam.sh
      # Role: Test probe rendering and audit build contracts, then build the diagnostic image locally without publishing.
      - name: Bounded runtime diagnostics and signer audit source contract
        run: |
          python3 scripts/ci/test-validator-runtime-probe-renderer.py
          python3 scripts/ci/test-web3signer-audit-contract.py
          bash scripts/ci/test-apply-hoodi-validator-runtime.sh
          docker build --platform linux/amd64 -f .ci/validator-runtime-probe/Dockerfile -t node-operator-runtime-probe:ci .
      # Role: Run UC-5 regression fixtures; this is not the deferred live revocation ceremony.
      - name: UC-5 Offline Contracts
        run: bash scripts/ci/run-suite.sh uc5-offline
      # Role: Test project admission policies with pinned tooling and local fixtures.
      - name: Project Kyverno admission policies
        env:
          KYVERNO_BIN: ${{ runner.temp }}/kyverno-policy-tools/kyverno
        run: bash scripts/ci/workflows/test-project-admission.sh
      # Role: Contract test: Verify Vault recovery authentication rejects unsafe inputs with mocked tools.
      - name: Recovery authentication preflight (mock CLI)
        run: bash scripts/ci/test-vault-recovery-auth.sh
      # Role: Contract test: Verify generated-root decoding accepts only canonical recovery material.
      - name: Generated-root decoder process-boundary contract
        run: bash scripts/ci/test-vault-generated-root-decode-contract.sh
      # Role: Contract test: Enforce the guarded live runtime-secret migration boundary.
      - name: Live Vault runtime secret migration contract
        run: bash scripts/ci/test-live-runtime-secret-migration-contract.sh
      # Role: Contract test: Reject live Vault cutover unless its preflight guards and approvals remain intact.
      - name: Live Vault cutover preflight contract
        run: bash scripts/ci/test-live-vault-cutover-preflight-contract.sh
      # Role: Contract test: Enforce guarded Engine API Vault cutover sequencing and evidence boundaries.
      - name: Live Engine Vault cutover contract
        run: bash scripts/ci/test-live-engine-vault-cutover-contract.sh
      # Role: Contract test: Enforce guarded validator runtime Vault cutover sequencing and evidence boundaries.
      - name: Live validator Vault cutover contract
        run: bash scripts/ci/test-live-validator-vault-cutover-contract.sh
      # Role: Contract test: Ensure legacy validator TLS mounts are removed without broadening runtime access.
      - name: Legacy TLS mount pruning
        run: bash scripts/ci/test-prune-legacy-validator-tls-mounts.sh
      # Role: Contract test: Ensure signer identity evidence is a disposable Vault-injected mTLS GET-only probe.
      - name: Signer public-key evidence contract
        run: bash scripts/ci/test-collect-hoodi-signer-public-key-evidence-contract.sh
      # Role: Contract test: Enforce the guarded final removal of legacy live Vault secret paths.
      - name: Live Vault legacy-secret finalization contract
        run: bash scripts/ci/test-live-vault-secret-finalization-contract.sh
      # Role: Contract test: Require post-cutover Vault runtime convergence before finalization.
      - name: Live Vault cutover convergence contract
        run: bash scripts/ci/test-live-vault-cutover-convergence-contract.sh
      # Role: Contract test: Verify local Vault snapshot recovery cleans up without exposing credentials or shares.
      - name: Snapshot recovery cleanup lifecycle (mock CLI)
        run: python3 scripts/ci/test-vault-snapshot-recovery-cleanup.py
      # Role: Contract test: Verify the isolated Vault recovery KMS grant helper with synthetic dependencies.
      - name: Isolated recovery grant lifecycle (mock AWS only)
        run: python3 scripts/ci/test-isolated-vault-recovery-grant.py
      # Role: Exercise isolated recovery contracts with mocked services, not a real snapshot restore.
      - name: Isolated recovery session and restore boundaries (mocks only)
        run: bash scripts/ci/run-suite.sh isolated-recovery
      # Role: Contract test: Verify the Raft snapshot S3 upload integrity boundary with mocked dependencies.
      - name: Snapshot upload full-object integrity boundary (mock CLI)
        run: python3 scripts/ci/test-vault-snapshot-upload-integrity.py
      # Role: Test operator authentication setup and cleanup using mock CLI responses.
      - name: Operator authentication configuration and recovery lifecycle (mock CLI)
        run: bash scripts/ci/run-suite.sh operator-auth
      # Role: Run the Vault v2 secret ownership and migration regression suite.
      - name: Vault v2 runtime secret boundary
        run: |
          bash scripts/ci/run-suite.sh vault-v2
          python3 scripts/ci/test-vault-v2-initialization-boundary.py
      # Role: Contract test: Enforce pinned scanner-image dependencies and its restricted release workflow contract.
      - name: Scanner image release deduplication
        run: scripts/ci/test-scanner-image-release.sh
      # Role: Contract test: Preserve immutable scanner-image and evidence-gate contracts across security workflows.
      - name: Scanner evidence upload boundary
        run: scripts/ci/test-ci-security-evidence-contract.sh
      # Role: Verify long-term evidence archival uses Cosign and the dedicated immutable S3 boundary.
      - name: CI Evidence Archive Contract
        run: scripts/ci/test-ci-evidence-archive-contract.sh
      # Role: Contract test: Keep PR evidence Terraform validation bound to the deployable root module.
      - name: Evidence-gate Terraform contract
        run: scripts/ci/test-evidence-gate-terraform-contract.sh
      # Role: Contract test: Enforce pinned toolchain-image dependencies and restricted publication contracts.
      - name: Toolchain image release deduplication
        run: scripts/ci/test-toolchain-image-release.sh
      # Role: Contract test: Ensure image publishers have isolated, digest-scoped permissions and release paths.
      - name: Image publisher isolation
        run: scripts/ci/test-image-publisher-isolation.sh
      # Role: Contract test: Enforce the restricted Vault audit-relay publisher IAM source contract.
      - name: Audit relay publisher repository scope
        run: python3 scripts/ci/test-vault-relay-publisher-policy.py
      # Role: Keep the validator-client publisher's registry layer-read scope limited to reviewed Prysm and Fence repositories.
      - name: Validator client publisher repository scope
        run: python3 scripts/ci/test-validator-client-ecr-publisher-policy.py
      # Role: Verify selected-release Vault image authority reaches both installer and legacy platform inputs without cloud calls.
      - name: Vault artifact authority handoff (offline)
        run: bash scripts/ci/workflows/check-release-artifact-authority.sh
      # Role: Run offline Vault verification, applicability and signing boundary tests.
      - name: Frozen Vault runtime verification boundary
        run: bash scripts/ci/run-suite.sh vault-runtime
      # Role: Install the pinned verifier and test blob signing/tamper rejection using synthetic keys.
      - name: Pinned Cosign detached blob tamper rejection (synthetic keys only)
        run: |
          scripts/ci/install-validator-signing-fence-release-tools.sh "$RUNNER_TEMP/vault-blob-test-tools"
          COSIGN_BIN="$RUNNER_TEMP/vault-blob-test-tools/cosign" bash scripts/ci/test-vault-runtime-blob-roundtrip.sh
      # Role: Test Fence/probe input binding, offline publication gates and scan-attestation rejection.
      - name: Release scan attestation content contract
        run: bash scripts/ci/workflows/check-release-scan-attestations.sh
      # Role: Ensure the external posture and provenance controls remain pinned and bounded.
      - name: Repository posture and SLSA contracts
        run: bash scripts/ci/test-repository-posture-contract.sh
      # Role: Contract test: Verify private DAST mirror uses the approved scanner digest and restricted publication path.
      - name: Private DAST mirror boundary
        run: scripts/ci/test-private-dast-mirror-contract.sh
      # Role: Contract test: Enforce private DAST reachability and reject retired or overbroad proxy access.
      - name: Private DAST target access boundary
        run: scripts/ci/test-private-dast-access-contract.sh
      # Role: Contract test: Reject Terraform plans that widen or misdirect cross-pool connectivity.
      - name: Cross-pool connectivity plan boundary
        run: scripts/ci/test-cross-pool-connectivity-plan.sh
      # Role: Contract test: Enforce digest-pinned validator runtime mirror allowlist and publisher constraints.
      - name: Validator runtime mirror boundary
        run: scripts/ci/test-validator-runtime-mirror-contract.sh
      # Role: Contract test: Enforce the inlined release reproducibility gate and exact-SBOM SCA contracts.
      - name: Release reproducibility gate
        run: scripts/ci/test-release-reproducibility-gate-contract.sh
      # Role: Contract test: Verify pinned offline SBOM vulnerability scanning and its release evidence contract.
      - name: Release SBOM SCA gate
        run: scripts/ci/test-release-sbom-sca.sh
      # Role: Reject tampered image archives, SBOMs and build-subject receipts before publication.
      - name: Image SBOM Evidence Contract
        run: python3 scripts/ci/test-image-sbom-evidence.py
      # Role: Exercise exact-digest signature/attestation bindings and denial paths without registry credentials.
      - name: CI Image Signature Contract
        run: python3 scripts/ci/test-ci-image-attestation.py
      # Role: Reject invalid consumer evidence and tool versions using mocked Cosign; this is not live signature admission.
      - name: CI Image Consumer Contract
        run: python3 scripts/ci/test-verify-ci-image-evidence.py
      # Role: Verify private-runner denial occurs before Docker or registry credential use.
      - name: Private Runner Image Admission
        run: python3 scripts/ci/test-private-runner-image-admission.py
      # Role: Run both publisher scripts against traced doubles to prove denial blocks registry login or main promotion.
      - name: CI Image Publication Ordering
        run: python3 scripts/ci/test-ci-image-publication.py
      # Role: Reject incomplete kube-bench EKS reports and keep raw audit details out of normalized evidence.
      - name: EKS CIS Evidence Contract
        run: python3 scripts/ci/test-eks-cis-normalizer.py
      # Role: Test benchmark job rendering against synthetic selected-region AL2023 inventories; do not apply jobs.
      - name: EKS CIS Job Contract
        run: python3 scripts/ci/test-eks-cis-jobs.py
      # Role: Require complete node coverage and preserve failed assessments; no live benchmark execution.
      - name: EKS CIS Inventory Gate
        run: python3 scripts/ci/test-eks-cis-inventory.py
      # Role: Contract test: Verify release source eligibility accepts only approved workflow provenance.
      - name: Release source eligibility
        run: scripts/ci/test-release-source-eligibility.sh
      # Role: Contract test: Verify PR evidence collection binds GitHub workflow data to the reviewed commit.
      - name: Exact-SHA PR evidence check
        run: scripts/ci/test-pr-evidence-check.sh
      # Role: Contract test: Enforce the baseline infrastructure contract without external replacement resources.
      - name: Zero-resource foundation contract
        run: scripts/ci/test-zero-resource-contract.sh
      # Role: Verify deletion scope and dependency ordering without making real AWS calls.
      - name: Tagged deployment cleanup
        run: |
          python3 scripts/ci/test-tagged-cleanup.py
          bash scripts/ci/test-bootstrap-state-reconciliation-mocks.sh
      # Role: Verify approved artifact selection, zero-replica rendering, recovery and artifact-first ordering without live AWS calls.
      - name: Interactive infrastructure recovery boundary
        run: bash scripts/ci/workflows/check-installer-recovery-boundaries.sh
      # Role: Contract test: Reject Terraform plans that weaken reviewed SSM access-log retention.
      - name: Retained SSM plan boundary
        run: scripts/ci/test-ops-access-ssm-retention.sh
      # Role: Contract test: Verify the saved-plan release wrapper preserves approved SSM retention changes only.
      - name: Saved-plan SSM release wrapper
        run: scripts/ci/test-ops-access-retention-release.sh
  # Role: Preserve the required quality check and reject failed, cancelled or skipped dependencies.
  quality:
    # Compatibility context required by main protection; never report a skipped suite as success.
    name: quality
    needs: [fence-security, quality-tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # Role: Require both Code Quality and Fence Security to succeed; skipped dependencies do not pass.
      - name: Quality Gate
        env:
          FENCE_SECURITY_RESULT: ${{ needs.fence-security.result }}
          QUALITY_RESULT: ${{ needs.quality-tests.result }}
        run: test "$FENCE_SECURITY_RESULT" = success && test "$QUALITY_RESULT" = success
  # Role: Validate Rego decisions, Terraform policy fixtures and rendered Kubernetes policy fixtures.
  policy:
    name: Policy Rules
    runs-on: ubuntu-24.04
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Role: Install repository-pinned policy tools for the subsequent local checks.
      - name: Policy Tools
        run: scripts/ci/install-policy-tools.sh "$RUNNER_TEMP/node-operator-policy-tools"
      # Role: Run the policy suite against positive and negative fixtures.
      - name: Policy Rules
        run: bash scripts/ci/run-suite.sh policy
  # Role: Check evidence formats, workflow boundaries and orchestration regression contracts.
  policy-foundation:
    name: Evidence Contracts
    runs-on: ubuntu-24.04
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Role: Install repository-pinned policy tools for the subsequent local checks.
      - name: Policy Tools
        run: scripts/ci/install-policy-tools.sh "$RUNNER_TEMP/node-operator-policy-tools"
      # Role: Run evidence, event-routing and workflow isolation regressions.
      - name: Evidence Contracts
        run: bash scripts/ci/run-suite.sh policy-contracts
  # Role: Validate Terraform configurations with a pinned offline container; do not plan against or apply live infrastructure.
  terraform:
    name: Terraform Validation
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    env:
      TERRAFORM_IMAGE: ghcr.io/s1ns3nz0/node-operator/terraform-validation@sha256:1f2ac75ec09b43b4a79eaaae94eca8f8f1655315a5aa81e7c80d3a8a14ac189a
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Role: Pull the approved toolchain and validate the root Terraform module without cloud access.
      - name: Terraform with pinned offline toolchain
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
          docker pull "$TERRAFORM_IMAGE"
          bash scripts/ci/run-terraform-ci.sh root
      # Role: Run the whole-root dashboard and IAM plan contract with Terraform isolated in the pinned offline container.
      - name: Validator dashboard Terraform plan contract
        run: bash scripts/ci/run-terraform-ci.sh dashboard
      # Role: Validate private validator metrics contracts after the offline Terraform toolchain is available.
      - name: Validator CloudWatch monitoring contracts
        shell: bash
        run: bash scripts/ci/workflows/check-validator-monitoring.sh
      # Role: Validate enabled runtime configurations using isolated Terraform fixtures.
      - name: Enabled validator runtime mirror boundary
        run: bash scripts/ci/run-terraform-ci.sh runtime
      # Role: Validate standalone modules without AWS credentials or network access.
      - name: Standalone Terraform modules offline
        run: bash scripts/ci/run-terraform-ci.sh modules
      # Role: Check the foundation backend configuration in the offline toolchain.
      - name: Foundation backend contract
        run: bash scripts/ci/run-terraform-ci.sh foundation
      # Role: Check monitoring defaults and guarded EBS configuration contracts.
      - name: Basic monitoring and guarded EBS representation
        run: bash scripts/ci/run-terraform-ci.sh monitoring
  # Role: Scan the checked-out revision in a pinned container and upload bounded scanner evidence.
  security-scans:
    name: Security Scans
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    env:
      SCANNER_IMAGE: ghcr.io/s1ns3nz0/node-operator/security-scanners@sha256:b224334bb3b86a086dea3b11c1e8ad6e3b619dc350af3f9f54c4a85ba576f4c9
      # Keep the only uploadable scanner output in a non-hidden directory.
      # upload-artifact v6 excludes hidden paths by default; enabling them
      # would risk collecting unrelated hidden workspace state. The scanner
      # sees the workspace read-only and /evidence as a distinct output mount.
      EVIDENCE_ROOT: ${{ github.workspace }}/security-evidence
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Role: Authenticate to GHCR and pull the exact approved scanner image digest.
      - name: Pinned scanner image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
          docker pull "$SCANNER_IMAGE"
      # Role: Run Vault recovery boundary tests in a read-only, network-disabled container.
      - name: Isolated Vault recovery boundaries
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,noexec,nosuid,nodev
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --entrypoint python3 "$SCANNER_IMAGE"
          -B /workspace/scripts/ci/test-vault-recovery-boundary.py
      # Role: Scan the selected revision and write reports only to the dedicated evidence mount.
      - name: Redacted scanner evidence
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --volume "$EVIDENCE_ROOT:/evidence"
          "$SCANNER_IMAGE" /evidence
          "${{ github.event.pull_request.head.sha || github.sha }}"
          "${{ github.event.pull_request.base.sha || github.sha }}"
      # Role: Upload the selected scanner output directory, not the repository workspace.
      - name: Non-sensitive security evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: security-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 30
  # Role: Preserve the required scanners check and require successful completion of the scanner job.
  scanners:
    # Compatibility context required by main protection.
    name: scanners
    needs: [security-scans]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # Role: Require the Security Scans job to succeed before reporting the scanners check as passed.
      - name: Security Gate
        env:
          SECURITY_RESULT: ${{ needs.security-scans.result }}
        run: test "$SECURITY_RESULT" = success
