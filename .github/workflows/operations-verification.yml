# Purpose: Manually select private-runner diagnostics or Vault candidate verification; signing is separately opt-in.
name: CI Operations
on:
  workflow_dispatch:
    inputs:
      target:
        description: Select private-runner smoke or vault-runtime verification
        required: true
        type: choice
        options: [private-runner, vault-runtime]
      sign_evidence:
        description: Sign Vault runtime evidence after verification; ignored for private-runner
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: vault-runtime-candidate-verification
  cancel-in-progress: false

jobs:
  # Role: Exercise the protected private runner and AWS service connectivity without releasing artifacts.
  smoke:
    name: Private Connectivity
    if: github.ref == 'refs/heads/main' && inputs.target == 'private-runner'
    runs-on: codebuild-node-operator-baseline-private-release-${{ github.run_id }}-${{ github.run_attempt }}
    environment: private-runner-smoke
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Role: Fetch producer evidence from an explicitly approved publication run.
      - name: Image Approval Inputs
        env:
          RELEASE_BUILD_IMAGE: ${{ vars.RELEASE_BUILD_IMAGE }}
          RELEASE_BUILD_SOURCE_SHA: ${{ vars.RELEASE_BUILD_SOURCE_SHA }}
          RELEASE_BUILD_PUBLICATION_RUN_ID: ${{ vars.RELEASE_BUILD_PUBLICATION_RUN_ID }}
        run: bash scripts/ci/workflows/check-private-runner.sh --preflight
      - name: Approved Build Image Evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: toolchain-sbom-release-build-${{ vars.RELEASE_BUILD_SOURCE_SHA }}
          run-id: ${{ vars.RELEASE_BUILD_PUBLICATION_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-build-evidence
      - name: Image Verification Tools
        run: |
          scripts/ci/install-validator-signing-fence-release-tools.sh "$RUNNER_TEMP/image-verification-tools"
          printf '%s\n' "$RUNNER_TEMP/image-verification-tools" >> "$GITHUB_PATH"
      # Role: Verify signatures and producer evidence before pulling the approved image.
      - name: Ephemeral runner boundary
        env:
          RELEASE_BUILD_IMAGE: ${{ vars.RELEASE_BUILD_IMAGE }}
          RELEASE_BUILD_SOURCE_SHA: ${{ vars.RELEASE_BUILD_SOURCE_SHA }}
          RELEASE_BUILD_SBOM: ${{ runner.temp }}/release-build-evidence/sbom.cyclonedx.json
          RELEASE_BUILD_RECEIPT: ${{ runner.temp }}/release-build-evidence/receipt.json
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: bash scripts/ci/workflows/check-private-runner.sh
      # Role: Probe the private AWS connectivity required by release operations.
      - name: Private AWS service paths
        run: bash scripts/ci/workflows/check-private-services.sh
  # Role: Inspect and scan each frozen Vault candidate with its verifier role; do not deploy or sign.
  verify:
    name: Vault Runtime Verification
    if: github.ref == 'refs/heads/main' && inputs.target == 'vault-runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [server, agent, injector]
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Role: Collect digest-bound Vault component evidence without deploying a candidate.
      - name: Frozen Candidate Verification
        env:
          COMPONENT: ${{ matrix.component }}
          AWS_REGION: ap-northeast-2
          AWS_ROLE_ARN: ${{ vars.VAULT_RUNTIME_VERIFIER_ROLE_ARN }}
        run: bash scripts/ci/workflows/verify-frozen-vault-candidate.sh
      # Role: Write the bounded candidate scan and authorization summary to the job summary.
      - name: Candidate Scan Result
        if: always()
        run: bash scripts/ci/workflows/report-vault-candidate.sh
      # Role: Upload the candidate verification files selected by this workflow.
      - name: Non-sensitive verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vault-runtime-${{ matrix.component }}-verification
          path: |
            ${{ runner.temp }}/vault-runtime-evidence/*.json
            ${{ runner.temp }}/vault-runtime-evidence/version.txt
            ${{ runner.temp }}/vault-runtime-evidence/binary.sha256
            ${{ runner.temp }}/vault-runtime-evidence/dependencies.txt
          if-no-files-found: warn
          retention-days: 30
  # Role: Require successful candidate verification and explicit opt-in before signing a digest-bound statement.
  sign-evidence:
    name: Verification Signature
    needs: verify
    if: github.ref == 'refs/heads/main' && inputs.target == 'vault-runtime' && inputs.sign_evidence && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Role: Download verification outputs from this run, not arbitrary earlier runs.
      - name: Current Run Verification Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/workflows/download-vault-verification.sh
      # Role: Bind verification evidence to revision/run and sign only after eligibility checks.
      - name: Verification Statement Signature
        run: scripts/ci/workflows/sign-vault-runtime-verification.sh
      # Role: Upload the signed statement and verification evidence for downstream validation.
      - name: Signed Verification Evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vault-runtime-signed-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vault-signed-evidence/
          if-no-files-found: error
          retention-days: 30
