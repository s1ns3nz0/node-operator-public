# Purpose: Permanently retain only redacted, exact-head CI evidence after Cosign signing and verification.
name: CI Evidence Archive

on:
  workflow_run:
    workflows: [CI Evidence Gate]
    types: [completed]

permissions: {}

concurrency:
  group: ci-evidence-archive-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  archive:
    name: Signed Evidence Archive
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: ci-evidence-archive
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      CI_EVIDENCE_ARCHIVE_BUCKET: ${{ vars.CI_EVIDENCE_ARCHIVE_BUCKET }}
      AWS_ROLE_ARN: ${{ vars.CI_EVIDENCE_ARCHIVE_ROLE_ARN }}
    steps:
      - name: Trusted archive control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A successful CI Evidence Gate run has exactly one producer: the scanner
      # gate or a review-refresh decision. Keep their extraction roots separate;
      # Resolve evidence subject fails closed when neither or both is available.
      - name: Download exact gate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5.0.0
        continue-on-error: true
        with:
          pattern: ci-evidence-gate-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ci-evidence/gate
      - name: Download exact review decision
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5.0.0
        continue-on-error: true
        with:
          pattern: ci-review-decision-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ci-evidence/review
      - name: Resolve evidence subject
        id: subject
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/ci-evidence
          EXPECTED_GATE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: scripts/ci/resolve-ci-evidence-archive-subject.sh
      - name: Short-lived archive identity
        run: scripts/ci/assume-ci-evidence-archive-role.sh
      - name: Cosign sign, verify, and archive
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          scripts/ci/archive-ci-evidence.sh "${{ steps.subject.outputs.evidence_directory }}" "${{ steps.subject.outputs.subject_sha }}" "$RUN_ID" "$RUNNER_TEMP/ci-evidence-signed"
