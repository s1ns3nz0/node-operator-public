# Purpose: Build selected image families and publish only through their dedicated main-branch jobs.
name: Release Images

on:
  push:
  workflow_dispatch:
    inputs:
      target:
        description: Image family or individual toolchain to build and publish on main
        required: true
        default: all
        type: choice
        options: [all, installer-prerequisites, scanner, toolchains, fence, relay, prysm-mtls, signer-probe, kyverno-cli, terraform-validation, release-build, vault-release-signer, gitops-oci-mirror, argocd-bootstrap, vault-bootstrap]

permissions:
  contents: read

jobs:
  # Role: Resolve changed inputs or an explicit manual target into bounded image selections.
  select:
    name: Changed Image Inputs
    runs-on: ubuntu-24.04
    outputs:
      scanner: ${{ steps.select.outputs.scanner }}
      toolchains: ${{ steps.select.outputs.toolchains }}
      fence: ${{ steps.select.outputs.fence }}
      relay: ${{ steps.select.outputs.relay }}
      prysm_mtls: ${{ steps.select.outputs.prysm_mtls }}
      signer_probe: ${{ steps.select.outputs.signer_probe }}
      kyverno_cli: ${{ steps.select.outputs.kyverno_cli }}
      toolchain_matrix: ${{ steps.select.outputs.toolchain_matrix }}
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      # Role: Compare push inputs or validate the manual target and emit selected image/matrix outputs.
      - name: Image Selection
        id: select
        run: python3 scripts/ci/select-image-release.py
  # Role: Build and package a scanner image locally without registry write permission.
  scanner-build:
    name: Scanner Build
    needs: [select]
    if: needs.select.outputs.scanner == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      # Role: Build and export the scanner image plus its input hash; do not push to a registry.
      - id: build
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/node-operator/security-scanners
        run: bash scripts/release/build-scanner-image.sh
      # Role: Upload the exact files and artifact name below for later inspection or same-run consumption.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scanner-image-${{ github.sha }}
          path: |
            scanner-image.tar
            scanner-input.sha256
            scanner-sbom/
          if-no-files-found: error
          retention-days: 1
      # Role: Retain the small SBOM/receipt independently of the large image archive.
      - name: Scanner SBOM Evidence
        if: ${{ !cancelled() && hashFiles('scanner-sbom/**') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: scanner-sbom-${{ github.sha }}
          path: scanner-sbom/
          if-no-files-found: error
          retention-days: 90
  # Role: Verify the same-run build artifact and publish the scanner image to GHCR.
  scanner-publish:
    name: Scanner Publication
    needs: [select, scanner-build]
    if: github.ref == 'refs/heads/main' && needs.select.outputs.scanner == 'true' && needs.scanner-build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      # Role: Download the named build artifact from this workflow run before publication checks.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          name: scanner-image-${{ github.sha }}
          path: /tmp/scanner-image
      # Role: Install checksum-verified policy tools before evaluating SBOM publication prerequisites.
      - name: SBOM Policy Tools
        run: scripts/ci/install-policy-tools.sh "$RUNNER_TEMP/sbom-policy-tools"
      # Role: Install the existing checksum-pinned signing toolchain for keyless image and SBOM signatures.
      - name: Image Signing Tools
        run: |
          scripts/ci/install-validator-signing-fence-release-tools.sh "$RUNNER_TEMP/image-signing-tools"
          printf '%s\n' "$RUNNER_TEMP/image-signing-tools" >> "$GITHUB_PATH"
      # Role: Verify the downloaded scanner build inputs and publish with this job's registry token.
      - env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/node-operator/security-scanners
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: bash scripts/release/publish-scanner-image.sh
      # Role: Retain successful exact-digest signature and attestation verification evidence.
      - name: Scanner Signing Evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: scanner-signing-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/scanner-signing-evidence/
          if-no-files-found: error
          retention-days: 90

  # Role: Build only selected toolchain matrix entries without registry write permission.
  toolchain-build:
    name: Toolchain Build (${{ matrix.image }})
    needs: [select]
    if: needs.select.outputs.toolchains == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      matrix: ${{ fromJSON(needs.select.outputs.toolchain_matrix) }}
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      # Role: Build and export this toolchain matrix image plus its input hash; do not publish.
      - id: build
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/node-operator/${{ matrix.image }}
          INPUT_FILE: ${{ matrix.input_file }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_NAME: ${{ matrix.image }}
        run: bash scripts/release/build-toolchain-image.sh
      # Role: Upload the exact files and artifact name below for later inspection or same-run consumption.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: toolchain-${{ matrix.image }}-${{ github.sha }}
          path: |
            toolchain-image.tar
            toolchain-input.sha256
            toolchain-sbom/
          if-no-files-found: error
          retention-days: 1
      # Role: Retain stage-specific SBOM/receipt evidence without keeping image tarballs for 90 days.
      - name: Toolchain SBOM Evidence
        if: ${{ !cancelled() && hashFiles('toolchain-sbom/**') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: toolchain-sbom-${{ matrix.image }}-${{ github.sha }}
          path: toolchain-sbom/
          if-no-files-found: error
          retention-days: 90
  # Role: Verify selected same-run artifacts and publish toolchain images to GHCR.
  toolchain-publish:
    name: Toolchain Publication (${{ matrix.image }})
    needs: [select, toolchain-build]
    if: github.ref == 'refs/heads/main' && needs.select.outputs.toolchains == 'true' && needs.toolchain-build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix: ${{ fromJSON(needs.select.outputs.toolchain_matrix) }}
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      # Role: Download the named build artifact from this workflow run before publication checks.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          name: toolchain-${{ matrix.image }}-${{ github.sha }}
          path: /tmp/toolchain-image
      # Role: Install checksum-verified policy tools before evaluating SBOM publication prerequisites.
      - name: SBOM Policy Tools
        run: scripts/ci/install-policy-tools.sh "$RUNNER_TEMP/sbom-policy-tools"
      # Role: Install the existing checksum-pinned signing toolchain only in the main publication job.
      - name: Image Signing Tools
        run: |
          scripts/ci/install-validator-signing-fence-release-tools.sh "$RUNNER_TEMP/image-signing-tools"
          printf '%s\n' "$RUNNER_TEMP/image-signing-tools" >> "$GITHUB_PATH"
      # Role: Verify the downloaded toolchain build inputs and publish with this job's registry token.
      - env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/node-operator/${{ matrix.image }}
          INPUT_FILE: ${{ matrix.input_file }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_NAME: ${{ matrix.image }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: bash scripts/release/publish-toolchain-image.sh
      # Role: Preserve image, SBOM and build-receipt signature verification for each toolchain.
      - name: Toolchain Signing Evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: toolchain-signing-evidence-${{ matrix.image }}-${{ github.sha }}
          path: ${{ runner.temp }}/toolchain-signing-evidence/${{ matrix.image }}/
          if-no-files-found: error
          retention-days: 90
      # Role: Retain only the non-sensitive, post-verification records needed to bind installer-owned toolchains.
      - name: Upload toolchain publication record
        if: matrix.image == 'vault-bootstrap' || matrix.image == 'gitops-oci-mirror'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: toolchain-publication-record-${{ matrix.image }}-${{ github.sha }}
          path: ${{ runner.temp }}/toolchain-publication-records/${{ matrix.image }}-publication-record.json
          if-no-files-found: error
          retention-days: 30

  # Role: Require the reusable Fence SAST and isolated DAST suite before publishing Fence.
  fence-security:
    name: Fence SAST and DAST
    needs: [select]
    if: needs.select.outputs.fence == 'true'
    uses: ./.github/workflows/fence-security.yml
    permissions:
      contents: read
  # Role: Build, scan, sign and publish the Fence image through its protected OIDC environment.
  fence-publish:
    name: Fence Publication
    needs: [select, fence-security]
    if: github.ref == 'refs/heads/main' && needs.select.outputs.fence == 'true' && needs.fence-security.result == 'success'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    environment: validator-client-ecr-mirror
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      # Role: Build and scan Fence, publish its image and attach verifiable signing evidence.
      - name: Fence Image Release
        env:
          AWS_REGION: ap-northeast-2
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.VALIDATOR_CLIENT_ECR_MIRROR_ROLE_ARN }}
          DEPLOYMENT_NAME: ${{ vars.DEPLOYMENT_NAME || 'node-operator' }}
        run: scripts/release/publish-fence-image.sh
      # Role: Upload the bounded Fence release verification result.
      - name: Sanitized release verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validator-signing-fence-release-verification
          path: ${{ runner.temp }}/fence-release-verification.json
          if-no-files-found: error
          retention-days: 30

  # Role: Build and publish only the reviewed, pinned manual-native-mTLS Prysm source through its protected ECR environment.
  prysm-mtls-publish:
    name: Prysm mTLS Publication
    needs: [select]
    if: github.ref == 'refs/heads/main' && needs.select.outputs.prysm_mtls == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: validator-client-ecr-mirror
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      # Role: Validate the pinned native source and publish its resulting immutable ECR manifest.
      - name: Reviewed manual-native-mTLS Prysm image
        env:
          AWS_REGION: ap-northeast-2
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.VALIDATOR_CLIENT_ECR_MIRROR_ROLE_ARN }}
          DEPLOYMENT_NAME: ${{ vars.DEPLOYMENT_NAME || 'node-operator' }}
        run: bash scripts/release/publish-prysm-mtls-image.sh
      # Role: Preserve only the non-secret publication record; it is not an activation approval.
      - name: Prysm publication record
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: prysm-mtls-publication-record-${{ github.sha }}
          path: ${{ runner.temp }}/prysm-publication-records/prysm-mtls-publication-record.json
          if-no-files-found: error
          retention-days: 30
      # Role: Keep raw scan and verified signatures separate from the one-file admission record.
      - name: Prysm review evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: prysm-mtls-review-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/prysm-publication-records/evidence/
          if-no-files-found: error
          retention-days: 30

  # Role: Build and publish the first-party signer identity probe through the protected validator ECR environment.
  signer-probe-publish:
    name: Signer Identity Probe Publication
    needs: [select]
    if: github.ref == 'refs/heads/main' && needs.select.outputs.signer_probe == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: validator-client-ecr-mirror
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      # Role: Build, scan, attest, and publish the selected immutable signer-probe image.
      - name: First-party signer identity probe
        env:
          AWS_REGION: ap-northeast-2
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.VALIDATOR_CLIENT_ECR_MIRROR_ROLE_ARN }}
          DEPLOYMENT_NAME: ${{ vars.DEPLOYMENT_NAME || 'node-operator' }}
        run: bash scripts/release/publish-signer-identity-probe.sh
      # Role: Preserve the exact public record only; it is not an activation approval.
      - name: Signer probe publication record
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signer-probe-publication-record-${{ github.sha }}
          path: ${{ runner.temp }}/signer-probe-publication-records/signer-identity-probe-publication-record.json
          if-no-files-found: error
          retention-days: 30

  # Role: Publish the reviewed Kyverno CLI only to the canonical GitOps node repository.
  kyverno-cli-publish:
    name: Kyverno CLI Publication
    needs: [select]
    if: github.ref == 'refs/heads/main' && needs.select.outputs.kyverno_cli == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: gitops-oci-mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Reviewed Kyverno CLI image
        env:
          AWS_REGION: ap-northeast-2
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.GITOPS_OCI_MIRROR_ROLE_ARN }}
          DEPLOYMENT_NAME: node-operator
        run: bash scripts/release/publish-kyverno-cli-image.sh
      - name: Kyverno CLI publication record
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kyverno-cli-publication-record-${{ github.sha }}
          path: ${{ runner.temp }}/kyverno-cli-publication-records/kyverno-cli-publication-record.json
          if-no-files-found: error
          retention-days: 30
      - name: Kyverno CLI review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kyverno-cli-review-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/kyverno-cli-publication-records/evidence/
          if-no-files-found: warn
          retention-days: 30

  # Role: Build, scan, sign and publish the audit relay through its dedicated OIDC environment.
  relay-publish:
    name: Audit Relay Publication
    needs: [select]
    if: github.ref == 'refs/heads/main' && needs.select.outputs.relay == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    environment: vault-audit-relay-ecr-publish
    steps:
      # Role: Retrieve the configured source revision without persisting checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      # Role: Build and scan the audit relay, publish its image and sign the release evidence.
      - name: Audit Relay Release
        env:
          AWS_REGION: ap-northeast-2
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.VAULT_AUDIT_RELAY_ECR_PUBLISHER_ROLE_ARN }}
          DEPLOYMENT_NAME: ${{ vars.DEPLOYMENT_NAME || 'node-operator' }}
        run: scripts/release/publish-vault-audit-relay.sh
      # Role: Upload selected relay release evidence rather than runner credentials.
      - name: Non-secret release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vault-audit-relay-release-evidence
          path: ${{ runner.temp }}/vault-audit-relay-release-evidence/*.json
          if-no-files-found: warn
          retention-days: 30
