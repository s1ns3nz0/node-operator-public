apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prysm-beacon
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app.kubernetes.io/name: nethermind}
      containers:
        - name: beacon-chain
          image: offchainlabs/prysm-beacon-chain@sha256:49f8454eb2a756402eb781025e370eef7d613668c2914bad4cca9c1aa11fafa4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: {drop: [ALL]}
          startupProbe: {tcpSocket: {port: beacon-api}}
          readinessProbe:
            httpGet: {path: /eth/v1/node/health, port: beacon-api, scheme: HTTP}
          livenessProbe: {tcpSocket: {port: beacon-api}}
  volumeClaimTemplates:
    - metadata: {name: prysm-data}
      spec:
        storageClassName: prysm-hoodi-gp3-kms
        resources: {requests: {storage: 500Gi}}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: prysm-hoodi-gp3-kms}
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  iops: "6000"
  throughput: "250"
  encrypted: "true"
  kmsKeyId: alias/node-operator-baseline-ebs
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-prysm-dns}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: prysm-beacon}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}]
