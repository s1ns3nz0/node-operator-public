apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nethermind-execution
spec:
  template:
    spec:
      containers:
        - name: nethermind
          image: nethermind/nethermind:latest
  volumeClaimTemplates:
    - metadata: {name: nethermind-data}
      spec:
        storageClassName: standard
        resources: {requests: {storage: 20Gi}}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: nethermind-hoodi-gp3-kms}
provisioner: kubernetes.io/no-provisioner
parameters: {type: gp2, encrypted: "false"}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-nethermind-world}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: nethermind}}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
