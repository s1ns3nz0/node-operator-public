# Every Kyverno workload image is mirrored into the immutable private ECR
# repository. Tags are source-digest tokens, so ECR immutability prevents tag
# replacement. No registry credential is embedded: EKS node identity pulls it.
admissionController:
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: ["ALL"]}
    runAsNonRoot: true
  initContainer:
    image:
      registry: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com
      repository: node-operator-baseline-gitops-nodes
      tag: "e4f0f36f8a8c18427394894274278a94dbef5afefed915e38cf74f5a04cf9d64@sha256:e4f0f36f8a8c18427394894274278a94dbef5afefed915e38cf74f5a04cf9d64"
    resources:
      requests: {cpu: "100m", memory: "128Mi"}
      limits: {cpu: "250m", memory: "256Mi"}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: ["ALL"]}
      runAsNonRoot: true
  container:
    image:
      registry: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com
      repository: node-operator-baseline-gitops-nodes
      tag: "90ca6e44900da3471732b6954039505fb7348862496fea3f51f7859bdf93e508@sha256:90ca6e44900da3471732b6954039505fb7348862496fea3f51f7859bdf93e508"
    resources:
      requests: {cpu: "250m", memory: "256Mi"}
      limits: {cpu: "1", memory: "1Gi"}
